services:
  sonarqube-db:
    image: postgres:16-alpine
    networks:
      - ci-net
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:10.4-community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    networks:
      - ci-net
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    privileged: true
    user: root
    networks:
      - ci-net
    ports:
      - "8085:8080" # Port 8085 to avoid conflicts with other local services
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro # Mount project as read-only for Jenkins
      - docs-site:/var/jenkins_home/docs-site # Volume to export generated documentation
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true # Skip wizard and allow local checkout

  documentation:
    image: nginx:alpine
    networks:
      - ci-net
    ports:
      - "8090:80"
    volumes:
      - docs-site:/usr/share/nginx/html:ro # Serve the documentation generated by Jenkins
    restart: always

networks:
  ci-net:
    driver: bridge

volumes:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  jenkins-home:
  docs-site: # Shared volume for generated site
