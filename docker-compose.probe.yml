services:
  probe:
    build:
      context: .
      dockerfile: src/NetworkMonitoring.Probe/Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      DOTNET_ENVIRONMENT: Development
      Probe__InterfaceName: eth0
      Probe__EnableConsole: "false"
      Observability__OtlpEndpoint: http://localhost:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      Observability__EnableOtlpLogs: "true"
