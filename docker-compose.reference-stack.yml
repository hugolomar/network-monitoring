# Reference dev stack for session event streaming and session indexing.
# Kafka + Schema Registry support publication; Elasticsearch + Kafka Connect support indexing.
# Dev: PLAINTEXT on EXTERNAL listeners; production should use TLS/mTLS per quickstart / ADR 0008.

networks:
  kafka-net:
    driver: bridge

volumes:
  kafka-1-data: {}
  kafka-2-data: {}
  kafka-3-data: {}
  elasticsearch-data: {}
  connect-plugins: {}
  postgres-data: {}
  neo4j-data: {}
  grafana-data: {}
  kibana-data: {}
  fluent-bit-storage: {}
  logstash-data: {}

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    hostname: otel-collector
    # docker_stats needs to open the runtime socket; the image user is non-root by default.
    user: "0:0"
    networks:
      - kafka-net
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    volumes:
      - ./infrastructure/observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
      # Required by docker_stats for per-container resource metrics. Equivalent to host root
      # (ADR 0013); used for stats only, not for log collection.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  prometheus:
    image: prom/prometheus:v2.54.1
    hostname: prometheus
    networks:
      - kafka-net
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      otel-collector:
        condition: service_started

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.11.4
    hostname: apm-server
    networks:
      - kafka-net
    ports:
      - "8200:8200"
    depends_on:
      elasticsearch:
        condition: service_healthy
    command:
      - apm-server
      - -e
      - -E
      - apm-server.host=0.0.0.0:8200
      # Dev only: no secret token. Production must authenticate ingest per ADR 0013.
      - -E
      - apm-server.auth.anonymous.enabled=true
      # Local stack runs Kibana with security disabled, so Fleet cannot install the APM
      # integration package. Do not block publish on that precondition (dev only).
      - -E
      - apm-server.data_streams.wait_for_integration=false
      - -E
      - output.elasticsearch.hosts=["elasticsearch:9200"]
    healthcheck:
      # publish_ready stays false until APM can index; with wait_for_integration=false this
      # becomes true once Elasticsearch output is usable.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8200/ | grep -q '\"publish_ready\":true'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # Entry point for platform logs, pushed here by the container runtime's logging driver.
  # Reassembles multi-line records before anything downstream sees them (ADR 0013).
  fluent-bit:
    image: fluent/fluent-bit:5.0.9
    hostname: fluent-bit
    networks:
      - kafka-net
    ports:
      - "24224:24224"
    volumes:
      - ./infrastructure/observability/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infrastructure/observability/fluent-bit-parsers.conf:/fluent-bit/etc/multiline-parsers.conf:ro
      - fluent-bit-storage:/var/log/flb-storage
    depends_on:
      logstash:
        condition: service_started

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.4
    hostname: logstash
    networks:
      - kafka-net
    ports:
      - "8088:8080"
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./infrastructure/observability/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./infrastructure/observability/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - logstash-data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    hostname: alertmanager
    networks:
      - kafka-net
    ports:
      # Host 9093 is already kafka-2's EXTERNAL listener; keep container port 9093 for in-network clients.
      - "9095:9093"
    volumes:
      - ./infrastructure/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.external-url=http://localhost:9095

  # Stands in for a real notification channel so alert delivery is observable in dev.
  # Received payloads are echoed to container logs.
  alert-sink:
    image: mendhak/http-https-echo:31
    hostname: alert-sink
    networks:
      - kafka-net
    environment:
      HTTP_PORT: "8080"

  grafana:
    image: grafana/grafana:11.1.4
    hostname: grafana
    networks:
      - kafka-net
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.4
    hostname: kibana
    networks:
      - kafka-net
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    volumes:
      - kibana-data:/usr/share/kibana/data

  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-1
    # Standard output is pushed to Fluent Bit. Asynchronous delivery is required so that an
    # unavailable log receiver cannot stop a platform component from starting; records
    # produced meanwhile are buffered by the runtime and replayed once it returns.
    # Deliberately no depends_on: the connection is opened by the runtime daemon rather than
    # by the container, so ordering would add coupling without adding any guarantee.
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "8MB"
        tag: platform.log4j.kafka-1
    networks:
      - kafka-net
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Use /var/lib/kafka/data (Confluent entrypoint fixes ownership). Keep logs + metadata under the same mount.
      KAFKA_LOG_DIRS: /var/lib/kafka/data/kraft-combined-logs
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data/kraft-metadata
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-1:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-2
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "8MB"
        tag: platform.log4j.kafka-2
    networks:
      - kafka-net
    ports:
      - "9093:9093"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data/kraft-combined-logs
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data/kraft-metadata
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-2:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-3
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "8MB"
        tag: platform.log4j.kafka-3
    networks:
      - kafka-net
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data/kraft-combined-logs
      KAFKA_METADATA_LOG_DIR: /var/lib/kafka/data/kraft-metadata
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-3:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    hostname: schema-registry
    networks:
      - kafka-net
    ports:
      - "8081:8081"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    hostname: elasticsearch
    networks:
      - kafka-net
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.1
    hostname: connect
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "8MB"
        tag: platform.log4j.connect
    networks:
      - kafka-net
    ports:
      - "8083:8083"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_ADVERTISED_PORT: 8083
      CONNECT_LISTENERS: http://0.0.0.0:8083
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - connect-plugins:/usr/share/confluent-hub-components
    command:
      - bash
      - -c
      - |
        set -e
        if ! compgen -G "/usr/share/confluent-hub-components/confluentinc-kafka-connect-elasticsearch*" >/dev/null; then
          echo "Installing Elasticsearch Sink connector (first run)..."
          confluent-hub install --no-prompt confluentinc/kafka-connect-elasticsearch:14.1.6
        fi
        /etc/confluent/docker/run
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "8MB"
        tag: platform.postgres.postgres
    networks:
      - kafka-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: network_monitoring
      POSTGRES_USER: network_monitoring
      POSTGRES_PASSWORD: network_monitoring
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U network_monitoring -d network_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  neo4j:
    image: neo4j:5.22
    hostname: neo4j
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "8MB"
        tag: platform.neo4j.neo4j
    networks:
      - kafka-net
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/networkmonitoring123
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  network-monitoring-backend:
    build:
      context: .
      dockerfile: src/NetworkMonitoring.Backend/Dockerfile
    hostname: network-monitoring-backend
    networks:
      - kafka-net
    ports:
      - "5090:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    environment:
      # Uncomment the following line to enable Scalar API Documentation (Development mode only)
      # ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Observability__OtlpEndpoint: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Observability__EnableOtlpLogs: "true"
      Observability__EnableConsoleLogging: "true"
      Backend__ConnectionString: Host=postgres;Port=5432;Database=network_monitoring;Username=network_monitoring;Password=network_monitoring
      Backend__ApplyMigrationsOnStartup: "true"
      Backend__Graph__Provider: Neo4j
      Backend__Graph__Neo4jUri: bolt://neo4j:7687
      Backend__Graph__Neo4jUsername: neo4j
      Backend__Graph__Neo4jPassword: networkmonitoring123

  network-monitoring-integration-console:
    build:
      context: .
      dockerfile: src/NetworkMonitoring.IntegrationConsole/Dockerfile
    hostname: network-monitoring-integration-console
    networks:
      - kafka-net
    restart: unless-stopped
    depends_on:
      schema-registry:
        condition: service_healthy
      network-monitoring-backend:
        condition: service_healthy
    environment:
      IntegrationConsole__KafkaBootstrapServers: kafka-1:29092,kafka-2:29092,kafka-3:29092
      IntegrationConsole__SchemaRegistryUrl: http://schema-registry:8081
      IntegrationConsole__KafkaDeviceTopic: devices.detected
      IntegrationConsole__KafkaConsumerGroupId: device-ingestion-local
      IntegrationConsole__BackendBaseUrl: http://network-monitoring-backend:8080
      IntegrationConsole__KafkaSecurityProtocol: Plaintext
      Observability__OtlpEndpoint: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Observability__EnableOtlpLogs: "true"
      Observability__EnableConsoleLogging: "true"

  network-monitoring-device-management-ui:
    build:
      context: ./src/NetworkMonitoring.Frontend
      dockerfile: Dockerfile
      args:
        # Browser talks to the host-published Collector port, not the compose service name.
        VITE_OTEL_OTLP_HTTP_URL: http://localhost:4318
        VITE_OTEL_SAMPLE_RATIO: "0.2"
    hostname: network-monitoring-device-management-ui
    networks:
      - kafka-net
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      network-monitoring-backend:
        condition: service_healthy
