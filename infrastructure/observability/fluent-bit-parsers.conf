# Multi-line assembly is defined per log layout rather than per component, because the
# question that decides where a record ends is "how does this format start a new line".
# Each parser starts a record on a timestamp and treats everything else as continuation,
# which keeps an exception and its stack frames attached to the line that reported them.

# Broker and connector runtime: log4j with a bracketed timestamp.
[MULTILINE_PARSER]
    name          log4j_bracketed
    type          regex
    flush_timeout 2000
    rule          "start_state"   "/^\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}[.,]\d+\]/"   "cont"
    rule          "cont"          "/^(?!\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}[.,]\d+\])/" "cont"

# Graph store: leading timestamp without brackets.
[MULTILINE_PARSER]
    name          neo4j_timestamped
    type          regex
    flush_timeout 2000
    rule          "start_state"   "/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}[.,]\d+/"    "cont"
    rule          "cont"          "/^(?!\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}[.,]\d+)/" "cont"

# Relational store: continues a record on lines beginning with whitespace, which is how it
# emits STATEMENT, DETAIL and HINT blocks belonging to one event.
[MULTILINE_PARSER]
    name          postgres_continuation
    type          regex
    flush_timeout 2000
    rule          "start_state"   "/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/"   "cont"
    rule          "cont"          "/^[\t ]+/"                                "cont"
