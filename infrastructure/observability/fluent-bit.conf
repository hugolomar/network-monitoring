[SERVICE]
    Flush                     1
    Log_Level                 info
    Daemon                    off
    Parsers_File              /fluent-bit/etc/multiline-parsers.conf
    # Filesystem backing, because memory-only storage is the default and would
    # drop buffered records on restart (ADR 0013).
    storage.path              /var/log/flb-storage/
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 32M

[INPUT]
    Name                      forward
    Listen                    0.0.0.0
    Port                      24224
    storage.type              filesystem

# Stack traces span many lines and their order is only intact here; once records are
# separated downstream the association cannot be recovered (ADR 0013). Records are routed to
# a parser by log layout, which is what the tag's second segment encodes.
[FILTER]
    Name                      multiline
    Match                     platform.log4j.*
    multiline.key_content     log
    multiline.parser          log4j_bracketed
    buffer                    on
    flush_ms                  2000

[FILTER]
    Name                      multiline
    Match                     platform.neo4j.*
    multiline.key_content     log
    multiline.parser          neo4j_timestamped
    buffer                    on
    flush_ms                  2000

[FILTER]
    Name                      multiline
    Match                     platform.postgres.*
    multiline.key_content     log
    multiline.parser          postgres_continuation
    buffer                    on
    flush_ms                  2000

# Normalization, field contract and redaction all live in Logstash, so this output
# forwards the flat record as received.
[OUTPUT]
    Name                      http
    Match                     platform.*
    Host                      logstash
    Port                      8080
    URI                       /
    Format                    json
    json_date_key             false
    Retry_Limit               5
