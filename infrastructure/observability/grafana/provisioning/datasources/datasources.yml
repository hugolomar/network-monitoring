apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # Logs and traces share this store (ADR 0013), so a log line found here can be followed
  # into its trace without switching tools.
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: observability-logs-default
      timeField: "@timestamp"
      logMessageField: body
      logLevelField: severity_text
      dataLinks:
        # Traces are rendered by the Kibana APM UI; Grafana links out rather than
        # attempting to reconstruct a waterfall from raw documents.
        - field: traceId
          url: "http://localhost:5601/app/apm/traces?rangeFrom=now-24h&rangeTo=now&kuery=trace.id:%22${__value.raw}%22"
        - field: correlationId
          url: "http://localhost:5601/app/discover#/?_a=(query:(language:kuery,query:'correlationId:%22${__value.raw}%22'))"
