input {
  http {
    port  => 8080
    codec => json
  }
}

filter {
  # Component identity is supplied by the container runtime with every record; it arrives
  # with a leading slash that is not part of the name.
  mutate {
    gsub => [ "container_name", "^/", "" ]
  }
  mutate {
    add_field => {
      "[service.name]" => "%{container_name}"
      "[service.type]" => "platform"
      "[container.id]" => "%{container_id}"
    }
  }

  # Each platform family has its own text layout. Failures are tagged, never dropped, so the
  # record stays queryable as a parse failure (FR-014).
  # `(?m:.*)` rather than GREEDYDATA, because an assembled record carries its stack frames as
  # embedded newlines. Grok compiles with the Ruby engine, where `m` is the flag that lets a
  # dot cross a newline; `s` is not a valid group option there and fails at pipeline startup.
  if [service.name] =~ /^kafka-\d+$/ or [service.name] == "connect" {
    grok {
      match          => { "log" => "\[%{TIMESTAMP_ISO8601:event_time}\] %{LOGLEVEL:level} (?<message_body>(?m:.*))" }
      tag_on_failure => [ "_platform_parse_failure" ]
    }
  } else if [service.name] == "postgres" {
    grok {
      match          => { "log" => "%{TIMESTAMP_ISO8601:event_time}(?: %{WORD:event_timezone})? \[%{NUMBER:process_id}\] %{WORD:level}:%{SPACE}(?<message_body>(?m:.*))" }
      tag_on_failure => [ "_platform_parse_failure" ]
    }
  } else if [service.name] == "neo4j" {
    grok {
      match          => { "log" => "%{TIMESTAMP_ISO8601:event_time} %{LOGLEVEL:level}%{SPACE}(?<message_body>(?m:.*))" }
      tag_on_failure => [ "_platform_parse_failure" ]
    }
  } else {
    mutate {
      add_tag => [ "_platform_unknown_source" ]
    }
  }

  # Event time from the body, so records are not all stamped with their ingest time.
  if [event_time] {
    date {
      match  => [ "event_time", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss.SSSZ" ]
      target => "@timestamp"
      tag_on_failure => [ "_platform_time_parse_failure" ]
    }
  }

  # One severity vocabulary across authored services and platform components (FR-014).
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
    if [level] == "WARNING" {
      mutate { add_field => { "severity_text" => "WARN" } }
    } else if [level] == "LOG" or [level] == "NOTICE" or [level] == "STATEMENT" or [level] == "DETAIL" {
      mutate { add_field => { "severity_text" => "INFO" } }
    } else if [level] == "PANIC" {
      mutate { add_field => { "severity_text" => "FATAL" } }
    } else {
      mutate { add_field => { "severity_text" => "%{level}" } }
    }
  } else {
    mutate { add_field => { "severity_text" => "UNKNOWN" } }
  }

  # An unparsed record keeps its raw line as the body rather than arriving empty.
  if [message_body] {
    mutate { rename => { "message_body" => "body" } }
  } else {
    mutate { copy => { "log" => "body" } }
  }

  # Telemetry hygiene on the platform path (FR-003). Platform logs never traverse the
  # Collector, so this is the only point at which redaction can be applied to them, and
  # relational store logs can echo statement values.
  # Group references are Ruby style (`\1`) and are written with a single backslash on purpose:
  # `config.support_escapes` is disabled by default, so a doubled backslash would reach the
  # regex engine as a literal backslash and the group would never be substituted.
  mutate {
    gsub => [
      "body", "(?i)\b(password|passwd|pwd|secret|token|api[_-]?key|authorization)\b(\s*[:=]\s*)(?:(?:bearer|basic|token)\s+)?(\"[^\"]*\"|'[^']*'|[^\s,;)]+)", "\1\2[REDACTED]",
      "body", "(?i)\b(bearer)\s+[A-Za-z0-9._-]+", "\1 [REDACTED]"
    ]
  }

  mutate {
    remove_field => [
      "log", "event_time", "event_timezone", "level", "process_id",
      "container_name", "container_id", "source", "date",
      "http", "url", "user_agent", "headers", "host", "@version"
    ]
  }
}

output {
  elasticsearch {
    hosts => [ "http://elasticsearch:9200" ]
    index => "observability-logs-platform-%{+YYYY.MM.dd}"
  }
}
